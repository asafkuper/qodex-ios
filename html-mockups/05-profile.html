<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QodeX - Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #0d0221;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 414px;
            height: 896px;
            background: linear-gradient(180deg, #1a0a2e 0%, #0d0221 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        .header {
            padding: 60px 24px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-title {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }
        
        .settings-btn {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        
        /* Profile Card */
        .profile-card {
            margin: 0 24px 24px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 215, 0, 0.05) 100%);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: 600;
            color: #1a0a2e;
            margin: 0 auto 16px;
        }
        
        .profile-name {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        
        .profile-email {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
        }
        
        .numbers-row {
            display: flex;
            justify-content: center;
            gap: 32px;
        }
        
        .number-item {
            text-align: center;
        }
        
        .number-value {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 600;
            color: #D4AF37;
            margin: 0 auto 8px;
        }
        
        .number-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 0 24px 24px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #D4AF37;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* Menu Section */
        .menu-section {
            padding: 0 24px;
        }
        
        .menu-title {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-left: 12px;
        }
        
        .menu-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .menu-icon {
            width: 32px;
            height: 32px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }
        
        .menu-text {
            font-size: 15px;
            color: #fff;
        }
        
        .menu-arrow {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.3);
        }
        
        /* Premium Banner */
        .premium-banner {
            margin: 24px;
            background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 100%);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .premium-icon {
            width: 48px;
            height: 48px;
            background: rgba(26, 10, 46, 0.2);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        
        .premium-content {
            flex: 1;
        }
        
        .premium-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a0a2e;
            margin-bottom: 4px;
        }
        
        .premium-subtitle {
            font-size: 13px;
            color: rgba(26, 10, 46, 0.7);
        }
        
        .premium-btn {
            background: #1a0a2e;
            color: #D4AF37;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(13, 2, 33, 0.95);
            backdrop-filter: blur(20px);
            padding: 16px 24px 40px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .nav-item.active .nav-icon,
        .nav-item.active .nav-label {
            color: #D4AF37;
        }
        
        .nav-icon {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.4);
        }
        
        .nav-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="header-title">Profile</h1>
            <div class="settings-btn">⚙️</div>
        </div>
        
        <!-- Profile Card -->
        <div class="profile-card">
            <div class="avatar">S</div>
            <h2 class="profile-name">Shani</h2>
            <p class="profile-email">shani@qodex.app</p>
            
            <div class="numbers-row">
                <div class="number-item">
                    <div class="number-value">7</div>
                    <p class="number-label">Life Path</p>
                </div>
                <div class="number-item">
                    <div class="number-value">3</div>
                    <p class="number-label">Expression</p>
                </div>
                <div class="number-item">
                    <div class="number-value">1</div>
                    <p class="number-label">Soul Urge</p>
                </div>
            </div>
        </div>
        
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <p class="stat-value">156</p>
                <p class="stat-label">Readings</p>
            </div>
            <div class="stat-card">
                <p class="stat-value">23</p>
                <p class="stat-label">Day Streak</p>
            </div>
            <div class="stat-card">
                <p class="stat-value">89%</p>
                <p class="stat-label">Accuracy</p>
            </div>
        </div>
        
        <!-- Premium Banner -->
        <div class="premium-banner">
            <div class="premium-icon">👑</div>
            <div class="premium-content">
                <p class="premium-title">QodeX Premium</p>
                <p class="premium-subtitle">Unlock all features</p>
            </div>
            <div class="premium-btn">Upgrade</div>
        </div>
        
        <!-- Menu -->
        <div class="menu-section">
            <p class="menu-title">Settings</p>
            
            <div class="menu-list">
                <div class="menu-item">
                    <div class="menu-left">
                        <div class="menu-icon">🔔</div>
                        <span class="menu-text">Notifications</span>
                    </div>
                    <span class="menu-arrow">→</span>
                </div>
                
                <div class="menu-item">
                    <div class="menu-left">
                        <div class="menu-icon">🌐</div>
                        <span class="menu-text">Language</span>
                    </div>
                    <span class="menu-arrow">→</span>
                </div>
                
                <div class="menu-item">
                    <div class="menu-left">
                        <div class="menu-icon">🔒</div>
                        <span class="menu-text">Privacy</span>
                    </div>
                    <span class="menu-arrow">→</span>
                </div>
                
                <div class="menu-item">
                    <div class="menu-left">
                        <div class="menu-icon">❓</div>
                        <span class="menu-text">Help & Support</span>
                    </div>
                    <span class="menu-arrow">→</span>
                </div>
            </div>
        </div>
        
        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Home</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">📖</span>
                <span class="nav-label">Learn</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">✦</span>
                <span class="nav-label">Insights</span>
            </div>
            <div class="nav-item active">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Profile</span>
            </div>
        </div>
    </div>
</body>
</html>
