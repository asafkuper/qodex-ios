<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QodeX - Onboarding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #0d0221;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 414px;
            height: 896px;
            background: linear-gradient(180deg, #1a0a2e 0%, #0d0221 100%);
            position: relative;
            overflow: hidden;
        }
        
        /* Skip Button */
        .skip-btn {
            position: absolute;
            top: 60px;
            right: 24px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            background: none;
            border: none;
            z-index: 100;
        }
        
        /* Page Indicator */
        .page-indicator {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 100;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .dot.active {
            background: #D4AF37;
            width: 24px;
            border-radius: 4px;
        }
        
        /* Content */
        .content {
            padding: 120px 32px 40px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .illustration {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .illustration-bg {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            position: absolute;
        }
        
        .number-display {
            font-size: 120px;
            font-weight: 200;
            color: #D4AF37;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.5);
            position: relative;
            z-index: 10;
        }
        
        .text-content {
            text-align: center;
            margin-top: 40px;
        }
        
        .title {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            line-height: 1.3;
        }
        
        .description {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            margin-bottom: 40px;
        }
        
        /* CTA Button */
        .cta-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 100%);
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            color: #1a0a2e;
            cursor: pointer;
            margin-bottom: 12px;
        }
        
        .secondary-button {
            width: 100%;
            padding: 18px;
            background: transparent;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            font-size: 17px;
            font-weight: 500;
            color: #D4AF37;
            cursor: pointer;
        }
        
        /* Decorative Elements */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(40px);
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="skip-btn">Skip</button>
        
        <div class="page-indicator">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        
        <div class="glow"></div>
        
        <div class="content">
            <div class="illustration">
                <div class="illustration-bg"></div>
                <div class="number-display">7</div>
            </div>
            
            <div class="text-content">
                <h2 class="title">Discover Your Life Path Number</h2>
                <p class="description">
                    Your Life Path reveals your core purpose and the journey your soul chose for this lifetime. It's the most significant number in your numerology chart.
                </p>
                
                <button class="cta-button">Continue</button>
                <button class="secondary-button">I Already Know My Number</button>
            </div>
        </div>
    </div>
</body>
</html>
