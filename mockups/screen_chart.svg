  <text x="107" y="360" fill="#E5C158" font-family="SF Pro Rounded" font-size="36" font-weight="bold" text-anchor="middle">3</text>
  <rect x="202" y="290" width="167" height="100" rx="12" fill="#12121A" stroke="#2A2A3E" stroke-width="1"/>
