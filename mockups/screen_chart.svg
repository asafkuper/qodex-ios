  <text x="285" y="360" fill="#E5C158" font-family="SF Pro Rounded" font-size="36" font-weight="bold" text-anchor="middle">6</text>
  
  <rect x="24" y="405" width="167" height="100" rx="12" fill="#12121A" stroke="#2A2A3E" stroke-width="1"/>
  <text x="107" y="435" fill="#888888" font-family="SF Pro" font-size="11" text-anchor="middle">Personality</text>
  <text x="107" y="475" fill="#E5C158" font-family="SF Pro Rounded" font-size="36" font-weight="bold" text-anchor="middle">9</text>
  <rect x="202" y="405" width="167" height="100" rx="12" fill="#12121A" stroke="#2A2A3E" stroke-width="1"/>
  <text x="285" y="435" fill="#888888" font-family="SF Pro" font-size="11" text-anchor="middle">Birthday</text>
  <text x="285" y="475" fill="#E5C158" font-family="SF Pro Rounded" font-size="36" font-weight="bold" text-anchor="middle">15</text>
  
