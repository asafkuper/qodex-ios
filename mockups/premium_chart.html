<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QodeX - Chart Design</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --cosmic-black: #0A0A0F;
            --cosmic-elevated: #12121A;
            --cosmic-floating: #1A1A24;
            --gold-primary: #E5C158;
            --gold-bright: #F4D03F;
            --gold-muted: #B8954C;
            --purple-accent: #9B59B6;
            --blue-accent: #3498DB;
            --starlight: #FAFAFA;
            --starlight-secondary: #E5E5E5;
            --starlight-tertiary: #A1A1AA;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--cosmic-black);
            color: var(--starlight);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        
        .iphone-frame {
            width: 393px;
            height: 852px;
            background: var(--cosmic-black);
            border-radius: 55px;
            box-shadow: 
                0 0 0 12px #1a1a1a,
                0 50px 100px rgba(0,0,0,0.8),
                0 0 0 1px rgba(229, 193, 88, 0.1);
            overflow: hidden;
            position: relative;
        }
        
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: var(--cosmic-black);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 100;
        }
        
        .screen {
            width: 100%;
            height: 100%;
            padding: 60px 20px 100px;
            overflow-y: auto;
            background: linear-gradient(180deg, var(--cosmic-black) 0%, #0d0d14 100%);
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .header-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--starlight);
        }
        
        .header-action {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--starlight-tertiary);
        }
        
        /* Hero Card - Life Path */
        .hero-card {
            background: linear-gradient(135deg, rgba(229, 193, 88, 0.15) 0%, rgba(229, 193, 88, 0.05) 100%);
            border: 1px solid rgba(229, 193, 88, 0.2);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .hero-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(229, 193, 88, 0.2) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        .hero-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--gold-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        
        .hero-content {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .hero-number {
            font-size: 64px;
            font-weight: 700;
            background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        
        .hero-info {
            flex: 1;
        }
        
        .hero-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--starlight);
            margin-bottom: 4px;
        }
        
        .hero-subtitle {
            font-size: 14px;
            color: var(--starlight-tertiary);
        }
        
        /* Grid Cards */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .grid-card {
            background: rgba(18, 18, 26, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .grid-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }
        
        .grid-card.gold .grid-number {
            color: var(--gold-primary);
        }
        
        .grid-card.purple .grid-number {
            color: var(--purple-accent);
        }
        
        .grid-card.blue .grid-number {
            color: var(--blue-accent);
        }
        
        .grid-card.green .grid-number {
            color: #2ECC71;
        }
        
        .grid-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--starlight-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        
        .grid-number {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .grid-title {
            font-size: 13px;
            color: var(--starlight-secondary);
            font-weight: 500;
        }
        
        /* Unlock Banner */
        .unlock-banner {
            background: linear-gradient(135deg, rgba(229, 193, 88, 0.1) 0%, rgba(229, 193, 88, 0.02) 100%);
            border: 1px dashed rgba(229, 193, 88, 0.3);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .unlock-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(229, 193, 88, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        
        .unlock-content {
            flex: 1;
        }
        
        .unlock-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--gold-primary);
            margin-bottom: 4px;
        }
        
        .unlock-subtitle {
            font-size: 13px;
            color: var(--starlight-tertiary);
        }
        
        .unlock-arrow {
            font-size: 20px;
            color: var(--gold-primary);
        }
        
        /* Tab Bar */
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 83px;
            background: rgba(18, 18, 26, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px 20px;
        }
        
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        
        .tab-icon {
            font-size: 22px;
            color: var(--starlight-tertiary);
            transition: all 0.2s;
        }
        
        .tab-item.active .tab-icon {
            color: var(--gold-primary);
            text-shadow: 0 0 20px rgba(229, 193, 88, 0.5);
        }
        
        .tab-label {
            font-size: 10px;
            color: var(--starlight-tertiary);
            font-weight: 500;
        }
        
        .tab-item.active .tab-label {
            color: var(--gold-primary);
        }
    </style>
</head>
<body>
    <div class="iphone-frame">
        <div class="notch"></div>
        
        <div class="screen">
            <div class="header">
                <div class="header-title">Your Chart</div>
                <div class="header-action">⚙</div>
            </div>
            
            <!-- Hero Card - Life Path -->
            <div class="hero-card">
                <div class="hero-label">Life Path Number</div>
                <div class="hero-content">
                    <div class="hero-number">7</div>
                    <div class="hero-info">
                        <div class="hero-title">The Seeker</div>
                        <div class="hero-subtitle">Spiritual • Analytical • Wise</div>
                    </div>
                </div>
            </div>
            
            <!-- Grid of Numbers -->
            <div class="grid">
                <div class="grid-card gold">
                    <div class="grid-label">Expression</div>
                    <div class="grid-number">3</div>
                    <div class="grid-title">Creative</div>
                </div>
                
                <div class="grid-card purple">
                    <div class="grid-label">Soul Urge</div>
                    <div class="grid-number">6</div>
                    <div class="grid-title">Nurturing</div>
                </div>
                
                <div class="grid-card blue">
                    <div class="grid-label">Personality</div>
                    <div class="grid-number">9</div>
                    <div class="grid-title">Humanitarian</div>
                </div>
                
                <div class="grid-card green">
                    <div class="grid-label">Birthday</div>
                    <div class="grid-number">15</div>
                    <div class="grid-title">Leadership</div>
                </div>
            </div>
            
            <!-- Unlock Banner -->
            <div class="unlock-banner">
                <div class="unlock-icon">✦</div>
                <div class="unlock-content">
                    <div class="unlock-title">Unlock 5 More Numbers</div>
                    <div class="unlock-subtitle">See your complete blueprint</div>
                </div>
                <div class="unlock-arrow">→</div>
            </div>
        </div>
        
        <div class="tab-bar">
            <div class="tab-item">
                <div class="tab-icon">○</div>
                <div class="tab-label">Today</div>
            </div>
            
            <div class="tab-item active">
                <div class="tab-icon">◉</div>
                <div class="tab-label">Chart</div>
            </div>
            
            <div class="tab-item">
                <div class="tab-icon">○</div>
                <div class="tab-label">Community</div>
            </div>
            
            <div class="tab-item">
                <div class="tab-icon">○</div>
                <div class="tab-label">Learn</div>
            </div>
            
            <div class="tab-item">
                <div class="tab-icon">○</div>
                <div class="tab-label">Profile</div>
            </div>
        </div>
    </div>
</body>
</html>
