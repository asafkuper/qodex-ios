  <text x="90" y="418" fill="#888888" font-family="SF Pro" font-size="12">Life Path 3 • 5h ago</text>
  
  <text x="44" y="450" fill="#CCCCCC" font-family="SF Pro" font-size="14">Can someone explain Personal Year</text>
  <text x="44" y="470" fill="#CCCCCC" font-family="SF Pro" font-size="14">cycles? Mine just changed to 9 🙏</text>
  
  <text x="44" y="495" fill="#E5C158" font-family="SF Pro" font-size="13">♥ 12  💬 15</text>
  
  <!-- Tab Bar -->
  <rect x="0" y="769" width="393" height="83" fill="#12121A"/>
  
  <text x="39" y="815" fill="#888888" font-family="SF Pro" font-size="10" text-anchor="middle">Today</text>
  <text x="117" y="815" fill="#888888" font-family="SF Pro" font-size="10" text-anchor="middle">Chart</text>
  <text x="196" y="815" fill="#E5C158" font-family="SF Pro" font-size="10" text-anchor="middle">Community</text>
  <text x="275" y="815" fill="#888888" font-family="SF Pro" font-size="10" text-anchor="middle">Learn</text>
