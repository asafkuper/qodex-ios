  <text x="60" y="160" fill="#888888" font-family="SF Pro" font-size="15">Share your insight...</text>
  
  <!-- Post Card 1 -->
  <rect x="24" y="195" width="345" height="160" rx="16" fill="#12121A" stroke="#2A2A3E" stroke-width="1"/>
  
  <!-- Avatar -->
