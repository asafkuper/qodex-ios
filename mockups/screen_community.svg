  <text x="90" y="243" fill="#888888" font-family="SF Pro" font-size="12">Life Path 7 • 2h ago</text>
  
  <text x="44" y="280" fill="#CCCCCC" font-family="SF Pro" font-size="14">Today my number is 8 and I feel the</text>
  <text x="44" y="300" fill="#CCCCCC" font-family="SF Pro" font-size="14">power! Manifesting abundance ✨</text>
  
  <!-- Engagement -->
  <text x="44" y="335" fill="#E5C158" font-family="SF Pro" font-size="13">♥ 24  💬 8</text>
  
  <!-- Post Card 2 -->
