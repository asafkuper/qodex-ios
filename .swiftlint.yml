# SwiftLint Configuration for QodeX
# Run: swiftlint lint --config .swiftlint.yml

# Paths to include/exclude
included:
  - QodeX
  - QodeXTests
  - QodeXClip
  - QodeXWidget
  - QodeXWatch

excluded:
  - QodeX/Resources
  - QodeX/DesignSystem/Components/SacredGeometryBackground.swift
  - Tests
  - .build
  - DerivedData

# Disabled rules (we don't need these)
disabled_rules:
  - trailing_whitespace
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces
  - sorted_imports

# Enabled opt-in rules
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - file_name
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - legacy_random
  - let_var_whitespace
  - last_where
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - nimble_operator
  - nslocalizedstring_key
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - xct_specific_matcher
  - yoda_condition

# Rule configurations
line_length:
  warning: 150
  error: 200
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 10
  error: 20
  ignores_case_statements: true

nesting:
  type_level:
    warning: 2
  statement_level:
    warning: 5

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - k
    - n
    - q
    - vc
    - to
    - at
    - on
    - up
    - dx
    - dy

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60
  excluded:
    - QXColor
    - QXFont
    - QXSpacing
    - QXButton

function_parameter_count:
  warning: 6
  error: 10

large_tuple:
  warning: 3
  error: 5

control_statement:
  severity: warning

trailing_comma:
  severity: warning
  mandatory_comma: true

# Custom rules
custom_rules:
  # Prevent print statements (use QodeXLogger instead)
  no_print:
    name: "No print Statements"
    regex: "print\\("
    message: "Use QodeXLogger.shared instead of print()"
    severity: warning
  
  # Prevent fatalError in production
  no_fatal_error:
    name: "No fatalError"
    regex: "fatalError"
    message: "Avoid fatalError - handle errors gracefully"
    severity: error
  
  # Prevent force unwrapping
  no_force_unwrapping:
    name: "No Force Unwrapping"
    regex: "!\\s*$|as!"
    message: "Avoid force unwrapping - use optional binding"
    severity: warning
  
  # Encourage accessibility labels
  accessibility_label:
    name: "Accessibility Label"
    regex: "Button\\s*\\{[^}]*\\}"
    message: "Consider adding accessibilityLabel to buttons"
    severity: warning
  
  # Prevent hardcoded strings
  no_hardcoded_strings:
    name: "No Hardcoded Strings"
    regex: '"[A-Z][a-z]+[A-Z][a-z]+"'
    message: "Consider localizing this string"
    severity: warning

# Reporter type
reporter: "xcode"
